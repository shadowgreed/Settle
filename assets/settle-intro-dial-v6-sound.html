<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SETTLE — Intro: The Dial (v6, clock-cadence + hard sync)</title>
<style>
  :root {
    --bg:#0A0A0C;
    --orange:#FF982A;
    --spin-dur: 3200ms;
    --spin-delay: 250ms;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; }

  .stage { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }

  .dial { position:absolute; width:min(38vmin, 220px); aspect-ratio:1; opacity:0; }
  .playing .dial { animation: dialIn 200ms ease-out forwards; }
  @keyframes dialIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }

  .dial svg { width:100%; height:100%; overflow:visible; }

  .needle-group { transform-origin: 60px 60px; transform: rotate(-375deg); }
  .playing .needle-group {
    animation: spin var(--spin-dur) forwards;
    animation-delay: var(--spin-delay);
    animation-timing-function: cubic-bezier(0.14, 0.72, 0.16, 1);
  }
  @keyframes spin {
    0%   { transform: rotate(-375deg); }
    /* linear override: the shared cubic-bezier front-loads ~85% of its
       motion into the first ~15% of a segment. Reapplied to this ~12%-of-
       total ratchet-back, that compresses the whole reversal into a
       handful of ms (often under one frame) -- it plays but never reads as
       visible motion. Forcing linear here keeps it evenly paced and visible. */
    88%  { transform: rotate(9deg); animation-timing-function: linear; }
    94%  { transform: rotate(-2.5deg); animation-timing-function: linear; }
    100% { transform: rotate(0deg); }
  }

  .playing .ring { animation: ringClick 240ms ease-out forwards; animation-delay: calc(var(--spin-delay) + var(--spin-dur) * 0.88); }
  @keyframes ringClick {
    0%   { stroke:#3a3a42; }
    30%  { stroke:var(--orange); stroke-width:7; }
    100% { stroke:#3a3a42; stroke-width:6; }
  }
  .tick-top { opacity:0.35; }
  .playing .tick-top { animation: tickLight 240ms ease-out forwards; animation-delay: calc(var(--spin-delay) + var(--spin-dur) * 0.88); }
  @keyframes tickLight { to { opacity:1; } }

  @media (prefers-reduced-motion: reduce) {
    .playing .dial { animation: dialIn 300ms ease-out forwards; }
    .playing .needle-group { animation:none; transform: rotate(0deg); }
    .playing .ring, .playing .tick-top { animation:none; }
    .tick-top { opacity:1; }
  }

  .controls {
    position:fixed; bottom:max(24px, env(safe-area-inset-bottom)); left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    font-family:-apple-system,'Segoe UI',sans-serif;
  }
  .replay {
    background:transparent; color:#93939C; border:1px solid #2A2A32; border-radius:999px;
    padding:10px 22px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .replay:active { transform:scale(0.97); }
  .timing { color:#5C5C66; font-size:11px; letter-spacing:0.08em; text-align:center; }
</style>
</head>
<body>
  <div class="stage playing" id="stage">
    <div class="dial">
      <svg viewBox="0 0 120 120">
        <circle class="ring" cx="60" cy="60" r="52" fill="none" stroke="#3a3a42" stroke-width="6" stroke-linecap="round"/>
        <g stroke="#4a4a52" stroke-width="4" stroke-linecap="round">
          <line class="tick-top" x1="60" y1="6"  x2="60" y2="18" stroke="#FF982A"/>
          <line x1="87" y1="13.2" x2="81" y2="23.6"/>
          <line x1="106.8" y1="33" x2="96.4" y2="39"/>
          <line x1="114" y1="60" x2="102" y2="60"/>
          <line x1="106.8" y1="87" x2="96.4" y2="81"/>
          <line x1="87" y1="106.8" x2="81" y2="96.4"/>
          <line x1="60" y1="114" x2="60" y2="102"/>
          <line x1="33" y1="106.8" x2="39" y2="96.4"/>
          <line x1="13.2" y1="87" x2="23.6" y2="81"/>
          <line x1="6" y1="60" x2="18" y2="60"/>
          <line x1="13.2" y1="33" x2="23.6" y2="39"/>
          <line x1="33" y1="13.2" x2="39" y2="23.6"/>
        </g>
        <g class="needle-group">
          <line x1="60" y1="60" x2="60" y2="16" stroke="#FF982A" stroke-width="7" stroke-linecap="round"/>
          <circle cx="60" cy="60" r="7" fill="#FF982A"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="controls">
    <button class="replay" onclick="replay(true)">↻ Replay with sound</button>
    <div class="timing">SPIN 3.2s → CLICK · ~13 TICKS · TICKS DECELERATE WITH THE NEEDLE<br>first load is silent (browser rule) — tap replay to hear it</div>
  </div>

<script>
  // ---- animation restart ----
  function restartAnim() {
    const stage = document.getElementById('stage');
    stage.classList.remove('playing');
    void stage.offsetWidth;
    stage.classList.add('playing');
  }

  // ---- cubic-bezier(0.14, 0.72, 0.16, 1) solver (same curve as the CSS) ----
  function bezierY(x, p1x, p1y, p2x, p2y) {
    // find t for given x by bisection, then return y(t)
    let lo = 0, hi = 1, t = x;
    const bx = t => 3*p1x*t*(1-t)*(1-t) + 3*p2x*t*t*(1-t) + t*t*t;
    const by = t => 3*p1y*t*(1-t)*(1-t) + 3*p2y*t*t*(1-t) + t*t*t;
    for (let i = 0; i < 40; i++) {
      t = (lo + hi) / 2;
      if (bx(t) < x) lo = t; else hi = t;
    }
    return by(t);
  }

  // ---- compute tick times: when the needle crosses each 30° tick mark ----
  const SPIN_MS = 3200;
  const SPIN_DELAY_S = 0.25;
  const SEG1_END = 0.88;         // keyframe: -1265° -> 9° over first 88% of duration
  const ROT_START = -375, ROT_MID = 9;
  function tickTimes() {
    const times = [];
    let lastMark = Math.ceil(ROT_START / 30);
    const steps = 500;
    for (let i = 1; i <= steps; i++) {
      const frac = i / steps;                            // fraction of segment 1
      const eased = bezierY(frac, 0.14, 0.72, 0.16, 1);
      const rot = ROT_START + (ROT_MID - ROT_START) * eased;
      const mark = Math.floor(rot / 30);
      if (mark >= lastMark) {
        times.push(frac * SEG1_END * SPIN_MS / 1000);    // seconds from spin start
        lastMark = mark + 1;
      }
    }
    return times;
  }

  // ---- Web Audio: mechanical tick + final clunk, all synthesized ----
  let ctx = null;
  function tickAt(when, gainVal, freq, durMs) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass'; filt.frequency.value = freq; filt.Q.value = 6;
    osc.type = 'square'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, when);
    gain.gain.linearRampToValueAtTime(gainVal, when + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + durMs / 1000);
    osc.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
    osc.start(when); osc.stop(when + durMs / 1000 + 0.02);
  }
  function playSound() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime + SPIN_DELAY_S;            // same clock as the CSS spin delay
    const times = tickTimes();
    times.forEach((t, i) => {
      // ticks get a touch louder + lower as the spin slows (more "weight")
      const p = i / (times.length - 1);
      tickAt(t0 + t, 0.09 + 0.07 * p, 1700 - 600 * p, 40);
    });
    // the ratchet click: overshoot hit + settle clunk
    const clickT = t0 + SEG1_END * SPIN_MS / 1000;
    tickAt(clickT, 0.16, 1100, 45);                       // hit
    tickAt(clickT + 0.085, 0.12, 520, 70);                // low settle clunk
  }

  function replay(withSound) {
    restartAnim();
    if (withSound) playSound();
  }
</script>
</body>
</html>
