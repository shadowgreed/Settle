<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Primary meta -->
    <title>Settle</title>
    <meta name="description" content="Stop scrolling. Get a pick in seconds. The fastest way to decide what to watch on Netflix, Max, Disney+, Apple TV, and Prime Video." />

    <!-- Favicon — Settle "S" mark -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />

    <!-- Fonts: Cormorant Garamond (display headlines) + Outfit (UI body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />

    <!-- PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- iOS PWA — icon, status bar, title -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Settle" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS splash screens — prevents white flash on cold PWA launch.
         background-color on <body> (#0a0a0a) is the real guard; these
         images give Apple's system a dark canvas to show while JS boots.
         Covers iPhone SE → iPhone 15 Pro Max portrait. -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="%PUBLIC_URL%/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="%PUBLIC_URL%/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="%PUBLIC_URL%/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="%PUBLIC_URL%/splash-750x1334.png" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Settle — Stop scrolling. Get a pick." />
    <meta property="og:description" content="Answer a few mood questions, get one great pick. Solo, couples, or in theaters. Works with Netflix, Max, Disney+, Apple TV, and Prime Video." />
    <meta property="og:image"       content="https://trysettle.app/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url"         content="https://trysettle.app" />
    <meta property="og:site_name"   content="Settle" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Settle — Stop scrolling. Get a pick." />
    <meta name="twitter:description" content="Answer a few mood questions, get one great pick. Solo, couples, or in theaters. Netflix, Max, Disney+, Apple TV & Prime Video." />
    <meta name="twitter:image"       content="https://trysettle.app/og-image.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
